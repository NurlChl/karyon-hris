# NVIDIA SkillSpector suppressions for HRIS Community (triaged 2026-09-23).
# Only these rule/path pairs are accepted; anything new is still reported.
# Details: docs/SECURITY-AUDIT-2026-09.md in the workspace. Scan a git archive, not the working tree:
#   git archive --format=zip HEAD -o /tmp/hris-src.zip
#   skillspector scan /tmp/hris-src.zip --no-llm --baseline .skillspector-baseline.yaml
version: 2
rules:
  - id: "PE3"
    path: "Dockerfile"
    reason: "Copies .npmrc (legacy-peer-deps only, no token) into the build stage."
  - id: "PE3"
    path: "README.md"
    reason: "Documentation tells operators to keep .env private; no credential is read."
  - id: "PE3"
    path: "compose*.yml"
    reason: "env_file/.env references for deployment configuration."
  - id: "PE3"
    path: "package.json"
    reason: "npm scripts pass --env-file=.env to tsx for local tooling."
  - id: "PE3"
    path: "scripts/setup-env.mjs"
    reason: "Creates a new .env with random secrets and refuses to overwrite an existing one."
  - id: "PE3"
    path: "install.sh"
    reason: "Installer writes its own .env (mode 600) and never reads other credentials."
  - id: "PE4"
    path: "compose.lifecycle.yml"
    reason: "Opt-in Pro lifecycle overlay; Docker socket documented as root-equivalent."
  - id: "PE4"
    path: "install.sh"
    reason: "Only checks for the socket when --lifecycle is requested."
  - id: "PE2"
    path: "install.sh"
    reason: "chmod 600/700 restrict access; 'sudo' appears only in a printed hint."
  - id: "OH1"
    path: "src/app/layout.tsx"
    reason: "Static theme bootstrap script, no user input."
  - id: "OH1"
    path: "src/app/admin/inventory/page.tsx"
    reason: "Code39 SVG built from a fixed bar table; asset text is never embedded."
  - id: "E1"
    path: "src/app/api/v1/public/candidates/route.ts"
    reason: "Cloudflare Turnstile verification configured by the administrator."
  - id: "E1"
    path: "src/lib/notification/notificationService.ts"
    reason: "Resend/Fonnte/Twilio notification providers chosen by the administrator."
  - id: "PE3"
    path: ".env.example"
    reason: "Example configuration with empty secrets; documents variable names only."
  - id: "PE3"
    path: "src/lib/docs/content.ts"
    reason: "User guide text mentions .env; no credential is read."
  - id: "SC2"
    path: "README.md"
    reason: "Documented one-line installer (curl | sh over HTTPS from the license website, values from configuration); the product install path."
  - id: "SC2"
    path: "install.sh"
    reason: "Documented one-line installer (curl | sh over HTTPS from the license website, values from configuration); the product install path."
  - id: "TM2"
    path: "install.sh"
    reason: "Usage comment showing the documented curl | sh install command."
  - id: "SC2"
    path: "src/app/api/v1/license/route.ts"
    reason: "Builds the one-time upgrade command shown to the Superadmin; the code is single-use and expires in 15 minutes."
  - id: "SC2"
    path: "src/lib/docs/content.ts"
    reason: "User guide examples: installer command and an API call with a placeholder key."
  - id: "E1"
    path: "install.sh"
    reason: "Redeems the one-time upgrade code at the configured HTTPS license server (no redirects); response values are validated before use."
  - path: ".skillspector-baseline.yaml"
    reason: "This file only names the accepted patterns."
fingerprints: []
