# OPT-IN Pro lifecycle automation (backup, update, rollback by the agent).
#   COMPOSE_FILE=compose.image.yml:compose.lifecycle.yml   (install.sh --lifecycle writes this)
# Licensing does not need this file: activation happens in the app (Lisensi & Paket).
# The agent reads the signed lease from the app and verifies it before any Pro action.
# The Docker socket is root-equivalent on the host. Only enable this on a
# dedicated Linux server; the agent never publishes a port.
services:
  agent:
    image: ${HRIS_AGENT_IMAGE:?Set the private HRIS Agent image}
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID to the group id owning /var/run/docker.sock}"
    environment:
      HRIS_APP_URL: http://app:3000
      HRIS_AGENT_TOKEN: ${HRIS_AGENT_TOKEN:?Set HRIS_AGENT_TOKEN (min. 32 random characters)}
      # Must equal NEXTAUTH_URL: the lease is bound to this origin.
      HRIS_SITE_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL}
      LICENSE_PUBLIC_KEY_PEM_B64: ${LICENSE_PUBLIC_KEY_PEM_B64:?Set LICENSE_PUBLIC_KEY_PEM_B64}
      HRIS_AGENT_HOST: 127.0.0.1
      HRIS_AGENT_DATA_DIR: /data
      HRIS_HEALTH_URL: http://app:3000/api/v1/health
      # Absolute host paths, mounted at the same location so docker compose inside the agent resolves them.
      HRIS_COMPOSE_FILE: ${HRIS_INSTALL_DIR:?Set HRIS_INSTALL_DIR}/compose.image.yml,${HRIS_INSTALL_DIR}/compose.lifecycle.yml
      HRIS_COMPOSE_ENV_FILE: ${HRIS_INSTALL_DIR}/.env
      HRIS_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-hris}
      HRIS_COMPOSE_SERVICE: app
      HRIS_POSTGRES_SERVICE: postgres
      HRIS_DB_USER: ${HRIS_DB_USER:-hris}
      HRIS_DB_NAME: ${HRIS_DB_NAME:-hris}
      HRIS_IMAGE: ${HRIS_IMAGE}
      HRIS_BACKUP_DIR: ${HRIS_INSTALL_DIR}/backups
      AUTO_BACKUP_INTERVAL_HOURS: ${AUTO_BACKUP_INTERVAL_HOURS:-24}
      AUTO_UPDATE_INTERVAL_HOURS: ${AUTO_UPDATE_INTERVAL_HOURS:-0}
    depends_on:
      app:
        condition: service_started
    volumes:
      - agent_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HRIS_INSTALL_DIR}:${HRIS_INSTALL_DIR}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  agent_data:
