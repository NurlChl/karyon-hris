name: Build & push HRIS Community image (GHCR)

# Manual only: run from the Actions tab ("Run workflow") with the version you
# want to publish. This is the free Community image — it must end up PUBLIC on
# GHCR so install.sh can `docker pull` it without any login.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Version to publish, e.g. 1.0.0"
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        # Docker/GHCR image names must be all lowercase; github.repository_owner
        # keeps the account's original casing (e.g. NurlChl).
        run: echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}/hris' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Reminder
        run: |
          echo "::notice::First-ever push of a package defaults to PRIVATE on GHCR, even from a public-facing image."
          echo "::notice::Go to https://github.com/users/${{ github.repository_owner }}/packages/container/${{ env.IMAGE_NAME }}/settings (owner path may be lowercase) and set visibility to Public (one-time)."
