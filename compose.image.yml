# Image-only: used by install.sh and raw Compose (Dokploy) after an image is published.
# Values come from the .env next to this file (install.sh generates it) or the Dokploy environment.
# PostgreSQL 18 data lives in a new volume; a PostgreSQL 17 volume is never reused automatically.
name: ${COMPOSE_PROJECT_NAME:-hris}
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-trixie}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      APP_DB_NAME: ${HRIS_DB_NAME:-hris}
      APP_DB_USER: ${HRIS_DB_USER:-hris}
      APP_DB_PASSWORD: ${HRIS_DB_PASSWORD:?Set HRIS_DB_PASSWORD}
    configs:
      - source: app_db_role
        target: /docker-entrypoint-initdb.d/10-app-role.sh
        mode: 0555
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d \"$$APP_DB_NAME\""]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    image: ${HRIS_IMAGE:?Set a published image tag or digest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HRIS_DATABASE_URL: ""
      HRIS_DB_HOST: postgres
      HRIS_DB_PORT: "5432"
      HRIS_DB_NAME: ${HRIS_DB_NAME:-hris}
      HRIS_DB_USER: ${HRIS_DB_USER:-hris}
      HRIS_DB_PASSWORD: ${HRIS_DB_PASSWORD:?Set HRIS_DB_PASSWORD}
      HRIS_DB_SSL: disable
      AUTH_SECRET: ${AUTH_SECRET:?Set session secret}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # Number of reverse proxies in front of the app (1 for Dokploy/Traefik or nginx). 0 = none.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set encryption key}
      STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET:?Set signing secret}
      CRON_SECRET: ${CRON_SECRET:?Set cron secret}
      LOCAL_STORAGE_PATH: /app/storage
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # License website (HTTPS) used by Lisensi & Paket for activation and lease renewal.
      HRIS_LICENSE_SERVER: ${HRIS_LICENSE_SERVER:-}
      # Only with compose.lifecycle.yml: lets the agent read the signed lease from this app.
      HRIS_AGENT_TOKEN: ${HRIS_AGENT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/app/storage
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  postgres18_data:
  uploads:
configs:
  # Runs once on an empty data volume: the application connects as a
  # non-superuser that owns only its own database.
  app_db_role:
    content: |
      #!/bin/sh
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" \
        -v app_user="$$APP_DB_USER" -v app_password="$$APP_DB_PASSWORD" -v app_db="$$APP_DB_NAME" <<'SQL'
      CREATE ROLE :"app_user" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD :'app_password';
      CREATE DATABASE :"app_db" OWNER :"app_user";
      REVOKE ALL ON DATABASE :"app_db" FROM PUBLIC;
      SQL
